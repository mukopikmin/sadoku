version: v2
clean: true
plugins:
  - local: protoc-gen-es
    out: ../preview/gen
    opt:
      - target=ts
  - local: protoc-gen-go
    out: ../server/internal/gen
    opt:
      - paths=source_relative
      - Msadoku/preview/v1/preview.proto=github.com/mukopikmin/sadoku/internal/gen/sadoku/preview/v1;previewv1
  - local: protoc-gen-connect-go
    out: ../server/internal/gen
    opt:
      - paths=source_relative
      - Msadoku/preview/v1/preview.proto=github.com/mukopikmin/sadoku/internal/gen/sadoku/preview/v1;previewv1
