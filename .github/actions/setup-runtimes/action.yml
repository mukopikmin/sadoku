name: Setup project runtimes
description: Install the runtimes required by package.json engines.

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: package.json
        check-latest: true
        cache: npm
        cache-dependency-path: |
          package-lock.json
          src/preview/package-lock.json

    - name: Read Deno requirement
      id: engines
      shell: bash
      run: echo "deno=$(node -p 'require("./package.json").engines.deno')" >> "$GITHUB_OUTPUT"

    - name: Setup Deno
      uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      with:
        deno-version: ${{ steps.engines.outputs.deno }}
