name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          check-latest: true
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/preview/package-lock.json

      - name: Configure Deno
        id: engines
        run: |
          echo "deno=$(node -p 'require("./package.json").engines.deno')" >> "$GITHUB_OUTPUT"
          echo "DENO_DIR=$RUNNER_TEMP/sadoku-deno-cache" >> "$GITHUB_ENV"

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ steps.engines.outputs.deno }}

      - name: Install dependencies
        run: npm run install:deps

      - name: Check formatting
        if: runner.os == 'Linux'
        run: deno fmt --check

      - name: Type check
        if: runner.os == 'Linux'
        run: deno task check

      - name: Test repository tooling
        if: runner.os == 'Linux'
        run: deno task test

      - name: Build client assets
        run: npm run build:client

      - name: Check Go formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l cmd src/server src/preview/assets.go gen/go test/integration proxy)"

      - name: Vet Go server
        run: go vet ./...

      - name: Test Go server
        run: npm run test:server

      - name: Test client
        run: npm test

      - name: Vet Go proxy
        working-directory: proxy
        run: go vet ./...

      - name: Test Go proxy
        working-directory: proxy
        run: go test -race -count=1 -timeout=60s ./...

      - name: Build Go proxy
        working-directory: proxy
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      - name: Compile
        run: deno task compile --output "${{ runner.temp }}/sadoku-ci${{ runner.os == 'Windows' && '.exe' || '' }}"

      - name: Test Linux installer
        if: runner.os == 'Linux'
        run: |
          install_home="$(mktemp -d)"
          trap 'rm -rf "$install_home"' EXIT
          # Keep Go's read-only module cache outside the disposable install home.
          GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            HOME="$install_home" deno task install --version 0.0.0-ci
          test "$("$install_home/.local/bin/sadoku" --version)" = "sadoku 0.0.0-ci"

      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\install_windows_test.ps1
