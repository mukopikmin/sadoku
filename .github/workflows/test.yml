name: Test

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          check-latest: true
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/preview/package-lock.json

      - name: Install dependencies
        run: make deps

      - name: Check formatting
        run: make check-client-format

      - name: Build client assets
        run: make build-client

      - name: Test repository tooling
        run: make test-tools

      - name: Check Go formatting
        run: make check-go-format

      - name: Vet Go server
        run: make vet

      - name: Test Go server
        run: make test-server

      - name: Compile
        run: make build OUTPUT=/tmp/sadoku-ci

      - name: Test Linux installer
        run: make test-install

  client:
    name: Node
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          check-latest: true
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/preview/package-lock.json

      - name: Install dependencies
        run: make deps

      - name: Test client
        run: make test-client

  go-proxy:
    name: Go proxy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: false

      - name: Check formatting
        run: make check-proxy-format

      - name: Vet
        run: make vet-proxy

      - name: Test
        run: make test-proxy

      - name: Build
        run: make build-proxy

  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install GNU Make
        shell: powershell
        run: choco install make --version=4.4.1 --yes --no-progress

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          check-latest: true

      - name: Install dependencies
        run: make deps

      - name: Build client assets
        run: make build-client

      - name: Test Go backend on Windows
        run: make test-server GO_TEST_FLAGS="-count=1 -timeout=120s"

      - name: Build Windows binary
        run: make build OUTPUT=sadoku.exe

      - name: Test Windows installer
        shell: powershell
        run: .\scripts\install_windows_test.ps1
