name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Deno
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.8.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/preview/package-lock.json

      - name: Install dependencies
        run: npm run install:deps

      - name: Check protobuf schema and generated code
        run: npm run proto:check

      - name: Check formatting
        run: deno fmt --check

      - name: Type check
        run: deno task check

      - name: Test client
        run: npm test

      - name: Test
        run: deno task test

      - name: Compile
        run: deno task compile --output /tmp/sadoku-ci

      - name: Test Linux installer
        run: |
          install_home="$(mktemp -d)"
          trap 'rm -rf "$install_home"' EXIT
          HOME="$install_home" deno task install --version 0.0.0-ci
          test "$("$install_home/.local/bin/sadoku" --version)" = "sadoku 0.0.0-ci"

  go-proxy:
    name: Go proxy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: false

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            gofmt -d .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 -timeout=60s ./...

      - name: Build
        run: CGO_ENABLED=0 go build ./...

  windows-installer:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.8.0

      - name: Test Windows self-update
        run: deno test -P --filter Windows src/server/cli/update_test.ts

      - name: Test Windows installer
        shell: powershell
        run: .\scripts\install_windows_test.ps1

  client-worker-benchmark:
    name: Client workers ${{ matrix.workers }} / sample ${{ matrix.sample }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workers: [2, 3, 4]
        sample: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/preview/package-lock.json

      - name: Install dependencies
        run: npm run install:deps

      - name: Measure complete client suite
        env:
          BENCH_WORKERS: ${{ matrix.workers }}
          BENCH_SAMPLE: ${{ matrix.sample }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import time

          workers = int(os.environ["BENCH_WORKERS"])
          root = Path("/tmp/client-worker-benchmark")
          root.mkdir()
          command = ["npm", "--prefix", "src/preview", "test", "--",
                     f"--maxWorkers={workers}", "--reporter=json",
                     f"--outputFile={root / 'tests.json'}"]
          started = time.monotonic()
          peak_rss_kib = 0
          with (root / "test.log").open("w") as output:
              process = subprocess.Popen(command, stdout=output, stderr=subprocess.STDOUT)
              while process.poll() is None:
                  rows = subprocess.check_output(
                      ["ps", "-e", "-o", "pid=,ppid=,rss="], text=True)
                  processes = [tuple(map(int, row.split())) for row in rows.splitlines()]
                  descendants = {process.pid}
                  while True:
                      children = {pid for pid, parent, rss in processes if parent in descendants}
                      if children <= descendants:
                          break
                      descendants |= children
                  rss = sum(rss for pid, parent, rss in processes if pid in descendants)
                  peak_rss_kib = max(peak_rss_kib, rss)
                  time.sleep(0.25)
          elapsed = time.monotonic() - started
          tests = json.loads((root / "tests.json").read_text())
          result = {
              "sha": os.environ["GITHUB_SHA"],
              "workers": workers,
              "sample": int(os.environ["BENCH_SAMPLE"]),
              "cpus": len(os.sched_getaffinity(0)),
              "elapsed_seconds": round(elapsed, 3),
              "peak_process_tree_rss_mib": round(peak_rss_kib / 1024, 1),
              "files": len(tests["testResults"]),
              "passed": tests["numPassedTests"],
              "failed": tests["numFailedTests"],
              "success": tests["success"],
          }
          (root / "measurement.json").write_text(json.dumps(result, indent=2))
          print("CLIENT_WORKER_BENCHMARK=" + json.dumps(result))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("```json\n" + json.dumps(result, indent=2) + "\n```\n")
          if process.returncode or not tests["success"] or result["passed"] != 292 or result["files"] != 47:
              raise SystemExit(1)
          PY

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-workers-${{ matrix.workers }}-sample-${{ matrix.sample }}
          path: /tmp/client-worker-benchmark
