name: Test

on:
  pull_request:
    paths-ignore: &proxy-paths
      - "proxy/**"
      - ".github/workflows/proxy_test.yml"
      - ".github/workflows/cloud_run_proxy.yml"
  push:
    branches:
      - main
    paths-ignore: *proxy-paths

permissions:
  contents: read

jobs:
  test:
    name: Deno
    runs-on: ubuntu-latest
    env:
      DENO_DIR: /tmp/sadoku-deno-cache

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Deno requirement
        id: engines
        run: |
          deno_version="$(jq -er '.engines.deno' package.json)"
          echo "deno=${deno_version}" >> "${GITHUB_OUTPUT}"

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ steps.engines.outputs.deno }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          check-latest: true
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/preview/package-lock.json

      - name: Install dependencies
        run: npm run install:deps

      - name: Check formatting
        run: deno fmt --check

      - name: Type check
        run: deno task check

      - name: Test
        run: deno task test

      - name: Compile
        run: deno task compile --output /tmp/sadoku-ci

      - name: Test Linux installer
        run: |
          install_home="$(mktemp -d)"
          trap 'rm -rf "$install_home"' EXIT
          HOME="$install_home" deno task install --version 0.0.0-ci
          test "$("$install_home/.local/bin/sadoku" --version)" = "sadoku 0.0.0-ci"

  client:
    name: Node
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          check-latest: true
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/preview/package-lock.json

      - name: Install dependencies
        run: npm run install:deps

      - name: Test client
        run: npm test

  windows-installer:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Deno requirement
        id: engines
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).engines.deno
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Missing engines.deno in package.json" }
          "deno=$version" >> $env:GITHUB_OUTPUT

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ steps.engines.outputs.deno }}

      - name: Test Windows self-update
        run: deno test -P --filter Windows src/server/cli/update_test.ts

      - name: Test Windows installer
        shell: powershell
        run: .\scripts\install_windows_test.ps1
