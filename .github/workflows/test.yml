name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Deno
    runs-on: ubuntu-latest
    env:
      DENO_DIR: /tmp/sadoku-deno-cache

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup runtimes
        uses: ./.github/actions/setup-runtimes

      - name: Install dependencies
        run: npm run install:deps

      - name: Check runtime requirements
        run: npm run check:engines

      - name: Check formatting
        run: deno fmt --check

      - name: Type check
        run: deno task check

      - name: Test
        run: deno task test

      - name: Compile
        run: deno task compile --output /tmp/sadoku-ci

      - name: Test Linux installer
        run: |
          install_home="$(mktemp -d)"
          trap 'rm -rf "$install_home"' EXIT
          HOME="$install_home" deno task install --version 0.0.0-ci
          test "$("$install_home/.local/bin/sadoku" --version)" = "sadoku 0.0.0-ci"

  client:
    name: Node
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup runtimes
        uses: ./.github/actions/setup-runtimes

      - name: Install dependencies
        run: npm run install:deps

      - name: Test client
        run: npm test

  go-proxy:
    name: Go proxy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: false

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            gofmt -d .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 -timeout=60s ./...

      - name: Build
        run: CGO_ENABLED=0 go build ./...

  windows-installer:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup runtimes
        uses: ./.github/actions/setup-runtimes

      - name: Test Windows self-update
        run: deno test -P --filter Windows src/server/cli/update_test.ts

      - name: Test Windows installer
        shell: powershell
        run: .\scripts\install_windows_test.ps1
