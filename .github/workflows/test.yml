name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Deno
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.8.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/preview/package-lock.json

      - name: Install client dependencies
        run: npm ci --prefix src/preview

      - name: Check formatting
        run: deno fmt --check

      - name: Type check
        run: deno task check

      - name: Test client
        run: npm test

      - name: Test
        run: deno task test

      - name: Compile
        run: deno task compile --output /tmp/sadoku-ci

      - name: Test Linux installer
        run: |
          install_home="$(mktemp -d)"
          trap 'rm -rf "$install_home"' EXIT
          HOME="$install_home" deno task install --version 0.0.0-ci
          test "$("$install_home/.local/bin/sadoku" --version)" = "sadoku 0.0.0-ci"
