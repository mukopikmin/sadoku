name: Test

on:
  workflow_call:
  pull_request:
    paths-ignore: &proxy-paths
      - "src/proxy/**"
      - ".github/workflows/proxy_test.yml"
      - ".github/workflows/cloud_run_proxy.yml"
  push:
    branches:
      - main
    paths-ignore: *proxy-paths

permissions:
  contents: read

jobs:
  vet:
    name: Lint and vet
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/server/go.mod
          # Lint and vet must not populate the cache used by race tests and release builds.
          cache-dependency-path: |
            src/server/go.sum
            .github/workflows/test.yml
            .golangci.yml
            .golangci-lint-version
            Makefile

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/proto/package.json
          check-latest: true
          cache: npm
          cache-dependency-path: |
            src/proto/package-lock.json
            src/preview/package-lock.json

      - name: Install dependencies
        run: make deps

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: .golangci-lint-version
          install-only: true

      - name: Lint and vet Go server for native and cross-platform code
        run: make lint-go vet-cross

  client:
    name: Test client
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/proto/package.json
          check-latest: true
          cache: npm
          cache-dependency-path: |
            src/proto/package-lock.json
            src/preview/package-lock.json

      - name: Install dependencies
        run: make deps

      - name: Check formatting
        run: make check-client-format

      - name: Lint client
        run: make lint-client

      - name: Test client
        run: make test-client

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests use Linux; main pushes and release callers cover all platforms.
        os:
          ${{ fromJSON(github.event_name == 'pull_request' &&
          '["ubuntu-latest"]' ||
          '["ubuntu-latest","windows-latest","macos-15"]') }}
    env:
      CGO_ENABLED: "1"
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install GNU Make
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install make --version=4.4.1 --yes --no-progress

      - name: Select C compiler
        run: |
          if [[ "${RUNNER_OS}" == Windows ]]; then
            compiler="$(cygpath -m "$(command -v gcc)")"
            echo "$(dirname "${compiler}")" >> "${GITHUB_PATH}"
            echo "CC=${compiler}" >> "${GITHUB_ENV}"
            "${compiler}" --version
          elif [[ "${RUNNER_OS}" == macOS ]]; then
            echo 'CC=clang' >> "${GITHUB_ENV}"
          else
            echo 'CC=gcc' >> "${GITHUB_ENV}"
          fi

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/server/go.mod
          # Separate from Vet and protobuf generators; save the full test/build cache.
          cache-dependency-path: |
            src/server/go.sum
            Makefile
            .github/workflows/test.yml

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/proto/package.json
          check-latest: true
          cache: npm
          cache-dependency-path: |
            src/proto/package-lock.json
            src/preview/package-lock.json

      - name: Install dependencies
        run: make deps

      - name: Build client assets
        run: make build-client

      - name: Test workflow action
        if: runner.os == 'Linux'
        run: make test-actions

      - name: Check Go formatting
        if: runner.os == 'Linux'
        run: make check-go-format

      - name: Test Go server
        run: make test-server-with-assets

      - name: Compile
        run: >-
          make build-server OUTPUT="${{ runner.temp }}/sadoku-ci${{ runner.os ==
          'Windows' && '.exe' || '' }}"

      - name: Test source installer
        if: runner.os != 'Windows'
        run: make test-install-with-assets
