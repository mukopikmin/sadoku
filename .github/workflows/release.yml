name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions: {}

env:
  STABLE_TAG_PATTERN: '^v(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$'

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate approved release
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag-object: ${{ steps.release.outputs.tag-object }}
      previous-stable-tag: ${{ steps.release.outputs.previous-stable-tag }}
      previous-tag-object: ${{ steps.release.outputs.previous-tag-object }}

    steps:
      - name: Reject moved tags
        env:
          FORCED: ${{ github.event.forced }}
        run: test "${FORCED}" = false

      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version, main commit, and approved notes range
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          [[ "${RELEASE_TAG}" =~ ${STABLE_TAG_PATTERN} ]] || fail 'Invalid stable release tag'
          main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)"
          test "${GITHUB_SHA}" = "${main}" || fail 'Release must target the current main tip'
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "${GITHUB_SHA}"

          info="$(git for-each-ref '--format=%(objecttype)%0a%(contents:trailers:key=Previous-Stable-Tag,valueonly)' "refs/tags/${RELEASE_TAG}")"
          previous="${info#*$'\n'}"
          if [[ "${info}" != $'tag\n'* ]] ||
             { [[ "${previous}" != release-notes-baseline ]] && [[ ! "${previous}" =~ ${STABLE_TAG_PATTERN} ]]; }; then
            fail 'Require an annotated tag with exactly one valid Previous-Stable-Tag trailer'
          fi
          previous_sha="$(git rev-parse --verify "refs/tags/${previous}^{commit}")"
          test "${previous_sha}" != "${GITHUB_SHA}" || fail 'Notes range must contain changes'
          git merge-base --is-ancestor "${previous_sha}" "${GITHUB_SHA}"
          if [[ "${previous}" == release-notes-baseline ]]; then
            other_tags="$(git tag --list | awk -v current="${RELEASE_TAG}" -v stable="${STABLE_TAG_PATTERN}" '$0 != current && $0 ~ stable')"
            test -z "${other_tags}" || fail 'Stable tags exist without a stable release'
            test "${previous_sha}" = "$(git rev-list --max-parents=0 HEAD)" || fail 'First-release baseline must be the repository root'
          else
            jq -en --arg next "${RELEASE_TAG#v}" --arg old "${previous#v}" \
              'def parts: split(".") | map([length, .]); ($next | parts) > ($old | parts)' >/dev/null || fail 'Version must increase'
          fi
          {
            echo "version=${RELEASE_TAG#v}"
            echo "tag-object=$(git rev-parse "refs/tags/${RELEASE_TAG}")"
            echo "previous-stable-tag=${previous}"
            echo "previous-tag-object=$(git rev-parse "refs/tags/${previous}")"
          } >> "${GITHUB_OUTPUT}"

  test:
    name: Test tagged commit
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  build:
    name: Build release artifacts
    needs: [validate, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          check-latest: true
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/preview/package-lock.json

      - name: Install dependencies
        run: make deps

      - name: Build release artifacts
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: make dist VERSION="${VERSION}"

      - name: Upload release artifacts
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attest and publish
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      TAG_OBJECT: ${{ needs.validate.outputs.tag-object }}
      PREVIOUS_STABLE_TAG: ${{ needs.validate.outputs.previous-stable-tag }}
      PREVIOUS_TAG_OBJECT: ${{ needs.validate.outputs.previous-tag-object }}

    # Do not check out source or execute repository/dependency code with publish permissions.
    steps:
      - name: Download this build's immutable artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: dist

      - name: Attest release archives for consumers
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Generate notes and publish unchanged approved tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A retried publish must not supersede a newer stable release.
          latest="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' |
            jq -Rsr --arg pattern "${STABLE_TAG_PATTERN}" 'split("\n") | map(select(test($pattern))) | .[0] // "release-notes-baseline"')"
          test "${PREVIOUS_STABLE_TAG}" = "${latest}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f "tag_name=${RELEASE_TAG}" \
            -f "target_commitish=${GITHUB_SHA}" \
            -f "previous_tag_name=${PREVIOUS_STABLE_TAG}" \
            --jq '.body | select(type == "string" and test("\\S"))' > release-notes.md
          test -s release-notes.md
          # Tags remain mutable remote state even though source and artifacts are fixed.
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.sha)" = "${TAG_OBJECT}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${PREVIOUS_STABLE_TAG}" --jq .object.sha)" = "${PREVIOUS_TAG_OBJECT}"
          gh release create "${RELEASE_TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${RELEASE_TAG}" \
            --notes-file release-notes.md \
            --verify-tag \
            --latest | tee -a "${GITHUB_STEP_SUMMARY}"
          {
            echo "Target SHA: ${GITHUB_SHA}"
            echo "Notes range: ${PREVIOUS_STABLE_TAG}...${RELEASE_TAG}"
          } >> "${GITHUB_STEP_SUMMARY}"
