name: Protobuf

on:
  pull_request:
    paths:
      - .github/workflows/protobuf.yml
      - buf.gen.yaml
      - buf.yaml
      - deno.json
      - package.json
      - package-lock.json
      - proto/**
      - gen/ts/**
      - gen/go/**
      - go.mod
      - go.sum
  push:
    branches:
      - main
    paths:
      - .github/workflows/protobuf.yml
      - buf.gen.yaml
      - buf.yaml
      - deno.json
      - package.json
      - package-lock.json
      - proto/**
      - gen/ts/**
      - gen/go/**
      - go.mod
      - go.sum

permissions:
  contents: read

jobs:
  generated-code:
    name: Generated code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Deno requirement
        id: engines
        run: |
          deno_version="$(jq -er '.engines.deno' package.json)"
          echo "deno=${deno_version}" >> "${GITHUB_OUTPUT}"

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ steps.engines.outputs.deno }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          check-latest: true
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Go protobuf generators
        run: npm run proto:tools

      - name: Install protobuf tools
        run: npm ci --ignore-scripts

      - name: Check schema and generated code
        run: npm run proto:check
