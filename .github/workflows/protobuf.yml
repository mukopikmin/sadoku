name: Protobuf

on:
  pull_request:
    paths:
      - .github/workflows/protobuf.yml
      - .github/actions/setup-runtimes/**
      - buf.gen.yaml
      - buf.yaml
      - deno.json
      - package.json
      - package-lock.json
      - proto/**
      - gen/ts/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/protobuf.yml
      - .github/actions/setup-runtimes/**
      - buf.gen.yaml
      - buf.yaml
      - deno.json
      - package.json
      - package-lock.json
      - proto/**
      - gen/ts/**

permissions:
  contents: read

jobs:
  generated-code:
    name: Generated code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup runtimes
        uses: ./.github/actions/setup-runtimes

      - name: Install protobuf tools
        run: npm ci --ignore-scripts

      - name: Check schema and generated code
        run: npm run proto:check
