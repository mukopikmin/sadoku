name: Protobuf

on:
  pull_request:
    paths:
      - .github/workflows/protobuf.yml
      - Makefile
      - src/proxy/tasks.mk
      - .prettierrc.json
      - src/proto/buf.gen.yaml
      - src/proto/buf.yaml
      - src/proto/package.json
      - src/proto/package-lock.json
      - src/proto/**
      - src/preview/gen/**
      - src/server/internal/gen/**
      - src/server/go.mod
      - src/server/go.sum
  push:
    branches:
      - main
    paths:
      - .github/workflows/protobuf.yml
      - Makefile
      - src/proxy/tasks.mk
      - .prettierrc.json
      - src/proto/buf.gen.yaml
      - src/proto/buf.yaml
      - src/proto/package.json
      - src/proto/package-lock.json
      - src/proto/**
      - src/preview/gen/**
      - src/server/internal/gen/**
      - src/server/go.mod
      - src/server/go.sum

permissions:
  contents: read

jobs:
  generated-code:
    name: Generated code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/proto/package.json
          check-latest: true
          cache: npm
          cache-dependency-path: src/proto/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/server/go.mod
          # Generator versions live in src/proto/tasks.mk. Keep this cache separate from
          # the backend cache so a faster generator job cannot freeze an
          # incomplete snapshot without the CGO test and release builds.
          cache-dependency-path: |
            src/server/go.sum
            Makefile
            src/*/tasks.mk

      - name: Install Go protobuf generators
        run: make proto-tools

      - name: Install protobuf tools
        run: make deps

      - name: Check schema and generated code
        run: make proto-check
