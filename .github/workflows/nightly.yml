name: Nightly Release

on:
  workflow_run:
    workflows:
      - Test
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: nightly-release
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare nightly version
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      binary-version: ${{ steps.version.outputs.binary-version }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Calculate nightly version
        id: version
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          commit_timestamp="$(git show -s --format=%ct "${TESTED_SHA}")"
          commit_date="$(date -u -d "@${commit_timestamp}" +%Y%m%d)"
          short_sha="$(git rev-parse --short=8 "${TESTED_SHA}")"
          echo "binary-version=nightly-${commit_date}-${short_sha}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build nightly artifacts
    needs: prepare
    uses: ./.github/workflows/build-artifacts.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha }}
      version: nightly
      binary-version: ${{ needs.prepare.outputs.binary-version }}
      artifact-name: nightly-dist-${{ github.run_attempt }}

  release:
    name: Publish nightly release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Download nightly artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: dist

      - name: Move nightly tag
        run: |
          tag="nightly"
          git tag --force "${tag}" "${{ github.event.workflow_run.head_sha }}"
          git push origin "refs/tags/${tag}" --force

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="nightly"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release edit "${tag}" \
              --title "Nightly" \
              --notes "Latest tested build from main (${{ github.event.workflow_run.head_sha }})." \
              --prerelease \
              --latest=false
            gh release upload "${tag}" dist/* --clobber
          else
            gh release create "${tag}" dist/* \
              --title "Nightly" \
              --notes "Latest tested build from main (${{ github.event.workflow_run.head_sha }})." \
              --prerelease \
              --latest=false \
              --verify-tag
          fi

      - name: Remove superseded nightly releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list \
            --exclude-drafts \
            --limit 100 \
            --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly$"))) | .tagName' |
            while IFS= read -r tag; do
              gh release delete "${tag}" --cleanup-tag --yes
            done
