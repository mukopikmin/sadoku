name: Nightly Release

on:
  workflow_run:
    workflows:
      - Test
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: nightly-release
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish nightly release
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.8.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/preview/package-lock.json

      - name: Install client dependencies
        run: npm ci --prefix src/preview

      - name: Build nightly artifacts
        run: |
          commit_timestamp="$(git show -s --format=%ct "${{ github.event.workflow_run.head_sha }}")"
          commit_date="$(date -u -d "@${commit_timestamp}" +%Y%m%d)"
          short_sha="$(git rev-parse --short=8 "${{ github.event.workflow_run.head_sha }}")"
          deno task dist --version nightly --binary-version "nightly-${commit_date}-${short_sha}"

      - name: Move nightly tag
        run: |
          tag="nightly"
          git tag --force "${tag}" "${{ github.event.workflow_run.head_sha }}"
          git push origin "refs/tags/${tag}" --force

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="nightly"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release edit "${tag}" \
              --title "Nightly" \
              --notes "Latest tested build from main (${{ github.event.workflow_run.head_sha }})." \
              --prerelease \
              --latest=false
            gh release upload "${tag}" dist/* --clobber
          else
            gh release create "${tag}" dist/* \
              --title "Nightly" \
              --notes "Latest tested build from main (${{ github.event.workflow_run.head_sha }})." \
              --prerelease \
              --latest=false \
              --verify-tag
          fi

      - name: Remove superseded nightly releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list \
            --exclude-drafts \
            --limit 100 \
            --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly$"))) | .tagName' |
            while IFS= read -r tag; do
              gh release delete "${tag}" --cleanup-tag --yes
            done
