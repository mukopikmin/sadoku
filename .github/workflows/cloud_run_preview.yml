name: Cloud Run Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cloud-run-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PREVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PREVIEW_TAG: ${{ github.event_name == 'push' && 'main' || format('pr-{0}', github.event.pull_request.number) }}

jobs:
  build:
    name: Build preview image
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.action != 'closed' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout preview commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PREVIEW_SHA }}

      - name: Build image without cloud credentials
        run: |
          set -euo pipefail
          [[ "${PREVIEW_SHA}" =~ ^[0-9a-f]{40}$ ]]
          image="sadoku-preview:${PREVIEW_SHA}"
          docker build --tag "${image}" --file Dockerfile .
          docker save --output "${RUNNER_TEMP}/preview-image.tar" "${image}"

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-image-${{ env.PREVIEW_SHA }}
          path: ${{ runner.temp }}/preview-image.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy preview
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: cloud-run-preview
      url: ${{ steps.preview.outputs.url }}

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preview-image-${{ env.PREVIEW_SHA }}
          path: ${{ runner.temp }}/preview-image

      - name: Load image before cloud authentication
        run: |
          set -euo pipefail
          [[ "${PREVIEW_SHA}" =~ ^[0-9a-f]{40}$ ]]
          docker load --input "${RUNNER_TEMP}/preview-image/preview-image.tar"
          docker image inspect "sadoku-preview:${PREVIEW_SHA}" >/dev/null

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Push immutable image
        id: image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
          REPOSITORY: ${{ secrets.ARTIFACT_REGISTRY_REPOSITORY }}
        run: |
          set -euo pipefail
          [[ "${PROJECT_ID}" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]
          [[ "${REGION}" =~ ^[a-z]+[a-z0-9-]*[a-z0-9]$ ]]
          [[ "${REPOSITORY}" =~ ^[a-z][a-z0-9._-]{0,62}$ ]]
          [[ "${PREVIEW_SHA}" =~ ^[0-9a-f]{40}$ ]]

          registry="${REGION}-docker.pkg.dev"
          image="${registry}/${PROJECT_ID}/${REPOSITORY}/sadoku:${PREVIEW_SHA}"
          gcloud auth configure-docker "${registry}" --quiet
          docker tag "sadoku-preview:${PREVIEW_SHA}" "${image}"
          docker push "${image}"

          digest_image="$(docker inspect --format='{{index .RepoDigests 0}}' "${image}")"
          [[ "${digest_image}" =~ ^${registry}/${PROJECT_ID}/${REPOSITORY}/sadoku@sha256:[0-9a-f]{64}$ ]]
          echo "digest-image=${digest_image}" >> "${GITHUB_OUTPUT}"

      - name: Deploy tagged revision without traffic
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
          SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
          IMAGE: ${{ steps.image.outputs.digest-image }}
        run: |
          set -euo pipefail
          [[ "${SERVICE}" =~ ^[a-z]([a-z0-9-]{0,47}[a-z0-9])?$ ]]
          [[ "${PREVIEW_TAG}" =~ ^(main|pr-[1-9][0-9]*)$ ]]
          tag="${PREVIEW_TAG}"
          gcloud run deploy "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --image "${IMAGE}" \
            --tag "${tag}" \
            --no-traffic \
            --quiet

      - name: Resolve and verify preview URL
        id: preview
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
          SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
        run: |
          set -euo pipefail
          tag="${PREVIEW_TAG}"
          url=""
          for attempt in {1..12}; do
            url="$(gcloud run services describe "${SERVICE}" \
              --project "${PROJECT_ID}" \
              --region "${REGION}" \
              --format=json |
              jq -r --arg tag "${tag}" \
                '.status.traffic[]? | select(.tag == $tag) | .url // empty')"
            [[ -n "${url}" ]] && break
            sleep 5
          done
          if [[ -z "${url}" ]]; then
            echo "::error::Preview URL for tag ${tag} was not found after 12 attempts."
            exit 1
          fi
          [[ "${url}" =~ ^https://[a-z0-9-]+(\.[a-z0-9-]+)*\.run\.app$ ]]
          curl --fail --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 2 \
            --connect-timeout 10 --max-time 60 \
            "${url}"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          printf '## Cloud Run preview\n\n%s\n' "${url}" >> "${GITHUB_STEP_SUMMARY}"

  cleanup:
    name: Remove preview tag
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: cloud-run-preview

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Remove only this PR's revision tag
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
          SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "${SERVICE}" =~ ^[a-z]([a-z0-9-]{0,47}[a-z0-9])?$ ]]
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          tag="pr-${PR_NUMBER}"
          existing="$(gcloud run services describe "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format="value(status.traffic.filter(tag=${tag}).tag)" 2>/dev/null || true)"
          if [[ "${existing}" != "${tag}" ]]; then
            echo "Tag ${tag} is already absent; nothing to remove."
            exit 0
          fi
          gcloud run services update-traffic "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --remove-tags "${tag}" \
            --quiet
