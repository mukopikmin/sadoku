name: Proxy Test

on:
  pull_request:
    paths: &proxy-paths
      - "src/proxy/**"
      - ".github/workflows/proxy_test.yml"
      - ".golangci.yml"
      - ".golangci-lint-version"
      - "Makefile"
  push:
    branches:
      - main
    paths: *proxy-paths

permissions:
  contents: read

jobs:
  go-proxy:
    name: Go proxy (ubuntu-latest)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/proxy/go.mod
          cache: false

      - name: Check formatting
        run: make check-proxy-format

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: .golangci-lint-version
          install-only: true

      - name: Lint
        run: make lint-proxy

      - name: Test
        run: make test-proxy

      - name: Build
        run: make build-proxy
