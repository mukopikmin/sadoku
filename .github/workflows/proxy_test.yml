name: Proxy Test

on:
  pull_request:
    paths: &proxy-paths
      - "proxy/**"
      - ".github/workflows/proxy_test.yml"
  push:
    branches:
      - main
    paths: *proxy-paths

permissions:
  contents: read

jobs:
  go-proxy:
    name: Go proxy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: false

      - name: Check formatting
        run: make check-proxy-format

      - name: Vet
        run: make vet-proxy

      - name: Test
        run: make test-proxy

      - name: Build
        run: make build-proxy
