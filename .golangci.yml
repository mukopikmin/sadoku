version: "2"

run:
  timeout: 5m
  allow-serial-runners: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - nilerr
    - nolintlint
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unused
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    staticcheck:
      # Start with correctness checks; gofmt remains responsible for formatting.
      checks:
        - SA*
  exclusions:
    generated: strict
